<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.D.Gad | Pathology Final Exam Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #2d6a4f; --primary-light: #52b788; --primary-dark: #1b4332;
    --secondary: #1e7a7a; --secondary-light: #3d9e9e; --tertiary: #a8d5ba;
    --dark: #1a2a2a; --darker: #0d1818;
    --card-bg: rgba(255,255,255,0.08); --card-bg-hover: rgba(255,255,255,0.14);
    --light: #e8f0ee; --gray: #9ab0aa; --gray-light: #c5d9d3; --white: #f5faf8;
    --success: #52b788; --success-light: #74c69d;
    --error: #d97777; --error-light: #e8a8a8; --warning: #b8a07c;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Cairo', sans-serif; background: linear-gradient(145deg, #e8f0ee 0%, #d4e4df 40%, #c5d9d3 100%); color: #1a2a2a; min-height: 100vh; overflow-x: hidden; }
.hero-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at 30% 40%, rgba(45,106,79,0.06) 0%, rgba(200,220,215,0.95) 70%); z-index: -1; }
.particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: -1; }
.particle { position: absolute; background: rgba(45,106,79,0.08); border-radius: 50%; pointer-events: none; animation: floatParticle 25s infinite linear; }
@keyframes floatParticle { 0% { transform: translateY(100vh) rotate(0deg); opacity: 0; } 10% { opacity: 0.2; } 90% { opacity: 0.2; } 100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; } }
.navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(30,122,122,0.15); padding: 12px 24px; box-shadow: 0 2px 20px rgba(0,0,0,0.04); }
.nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
.logo-area { display: flex; align-items: center; gap: 12px; }
.logo-small { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--secondary); }
.brand { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
.progress-stats { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.stat-badge { padding: 4px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; background: rgba(45,106,79,0.06); border: 1px solid rgba(45,106,79,0.12); color: var(--dark); }
.stat-answered { background: rgba(30,122,122,0.06); border-color: rgba(30,122,122,0.15); }
.stat-correct { background: rgba(82,183,136,0.10); border-color: var(--success); color: var(--primary); }
.stat-wrong { background: rgba(217,119,119,0.08); border-color: var(--error); color: #8b5555; }
.stat-percent { background: rgba(45,106,79,0.08); border-color: var(--primary); color: var(--primary); }
.progress-bar-container { width: 160px; height: 5px; background: rgba(45,106,79,0.12); border-radius: 3px; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 3px; transition: width 0.3s; }
.start-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 100px 20px; }
.start-card { background: rgba(255,255,255,0.85); backdrop-filter: blur(15px); border: 1px solid rgba(45,106,79,0.12); border-radius: 32px; padding: 50px 40px; max-width: 640px; width: 100%; text-align: center; transition: all 0.3s; box-shadow: 0 8px 40px rgba(0,0,0,0.04); }
.start-card:hover { transform: translateY(-5px); border-color: var(--secondary); background: rgba(255,255,255,0.92); box-shadow: 0 12px 50px rgba(0,0,0,0.06); }
.main-logo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid var(--secondary); margin-bottom: 20px; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(30,122,122,0.2); } 50% { box-shadow: 0 0 0 15px rgba(30,122,122,0); } }
.start-card h1 { font-size: 2rem; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
.start-card .sub { color: var(--gray); margin-bottom: 25px; }
.filter-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 25px 0; }
.filter-btns button { padding: 8px 18px; border-radius: 30px; background: rgba(255,255,255,0.6); border: 1px solid rgba(45,106,79,0.10); color: var(--gray); cursor: pointer; font-family: 'Cairo', sans-serif; transition: all 0.2s; font-weight: 500; font-size: 0.85rem; }
.filter-btns button:hover { border-color: var(--primary); color: var(--primary); background: rgba(45,106,79,0.05); }
.filter-btns button.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-color: var(--primary); color: white; }
.q-count { margin: 20px 0; color: var(--gray); }
.q-count span { color: var(--primary); font-weight: 700; font-size: 1.3rem; }
.btn-start { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border: none; padding: 14px 40px; border-radius: 40px; color: white; font-size: 1.1rem; font-weight: 700; font-family: 'Cairo', sans-serif; cursor: pointer; transition: all 0.3s; width: 100%; }
.btn-start:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(45,106,79,0.25); }
.quiz-wrapper { display: none; padding: 100px 20px 60px; max-width: 900px; margin: 0 auto; }
.section-header { display: flex; align-items: center; gap: 12px; margin: 30px 0 20px; }
.section-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--primary), transparent); }
.section-line.right { background: linear-gradient(270deg, var(--primary), transparent); }
.section-title { color: var(--primary); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; background: rgba(45,106,79,0.06); padding: 5px 15px; border-radius: 20px; }
.question-card { background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); border-radius: 24px; padding: 28px; margin-bottom: 20px; border: 1px solid rgba(45,106,79,0.08); transition: all 0.3s; box-shadow: 0 2px 15px rgba(0,0,0,0.02); }
.question-card:hover { transform: translateX(-5px); border-color: var(--secondary); background: rgba(255,255,255,0.92); box-shadow: 0 4px 25px rgba(0,0,0,0.04); }
.question-card.correct { border-right: 4px solid var(--success); background: rgba(82,183,136,0.04); }
.question-card.wrong { border-right: 4px solid var(--error); background: rgba(217,119,119,0.04); }
.q-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.q-num { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; }
.q-cat { background: rgba(30,122,122,0.08); padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; color: var(--secondary); }
.q-text { font-size: 1.05rem; font-weight: 500; line-height: 1.6; margin-bottom: 20px; color: #1a2a2a; }
.options { display: flex; flex-direction: column; gap: 10px; }
.option { padding: 12px 18px; background: rgba(255,255,255,0.5); border: 1px solid rgba(45,106,79,0.08); border-radius: 14px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 12px; font-family: 'Cairo', sans-serif; font-size: 0.95rem; color: #1a2a2a; }
.option::before { content: attr(data-letter); width: 30px; height: 30px; border-radius: 50%; background: rgba(45,106,79,0.06); display: flex; align-items: center; justify-content: center; font-weight: 700; transition: all 0.2s; color: var(--primary); }
.option:hover:not(:disabled) { background: rgba(45,106,79,0.04); border-color: var(--primary); transform: translateX(-5px); }
.option.correct { background: rgba(82,183,136,0.08); border-color: var(--success); color: var(--primary); }
.option.correct::before { background: var(--success); color: white; }
.option.wrong { background: rgba(217,119,119,0.08); border-color: var(--error); color: #8b5555; }
.option.wrong::before { background: var(--error); color: white; }
.option:disabled { cursor: default; }
.feedback { margin-top: 16px; padding: 12px 16px; border-radius: 12px; font-size: 0.85rem; display: none; animation: slideDown 0.3s ease; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
.feedback.correct { background: rgba(82,183,136,0.06); border-right: 3px solid var(--success); color: var(--primary); }
.feedback.wrong { background: rgba(217,119,119,0.06); border-right: 3px solid var(--error); color: #8b5555; }
.submit-area { text-align: center; margin: 30px 0; }
.btn-submit { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border: none; padding: 14px 50px; border-radius: 40px; color: white; font-size: 1rem; font-weight: 700; font-family: 'Cairo', sans-serif; cursor: pointer; transition: all 0.3s; }
.btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(45,106,79,0.25); }
.btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }
.results-screen { max-width: 800px; margin: 100px auto 50px; padding: 40px; background: rgba(255,255,255,0.90); backdrop-filter: blur(15px); border-radius: 32px; border: 1px solid rgba(45,106,79,0.10); text-align: center; display: none; animation: zoomIn 0.5s ease; box-shadow: 0 8px 40px rgba(0,0,0,0.04); }
@keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
.results-logo { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid var(--secondary); margin-bottom: 20px; }
.results-screen h2 { color: var(--primary); font-size: 2rem; margin-bottom: 10px; }
.score-circle { width: 150px; height: 150px; margin: 25px auto; position: relative; }
.score-svg { transform: rotate(-90deg); }
.score-bg { fill: none; stroke: rgba(45,106,79,0.08); stroke-width: 10; }
.score-fill { fill: none; stroke: url(#scoreGrad); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
.score-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
.score-big { font-size: 2rem; font-weight: 800; color: var(--primary); }
.result-msg { color: var(--gray); margin: 15px 0; }
.results-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 25px 0; }
.result-stat { padding: 15px; border-radius: 16px; }
.result-stat.c { background: rgba(82,183,136,0.06); border: 1px solid var(--success); }
.result-stat.w { background: rgba(217,119,119,0.06); border: 1px solid var(--error); }
.result-stat.p { background: rgba(30,122,122,0.06); border: 1px solid var(--secondary); }
.result-stat .num { font-size: 1.8rem; font-weight: 800; }
.result-stat.c .num { color: var(--primary); }
.result-stat.w .num { color: #8b5555; }
.result-stat.p .num { color: var(--secondary); }
.result-stat .label { font-size: 0.85rem; color: var(--gray); }
.btn-restart { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border: none; padding: 12px 30px; border-radius: 40px; color: white; font-weight: 700; font-family: 'Cairo', sans-serif; cursor: pointer; margin: 10px 5px; transition: all 0.3s; }
.btn-home { background: rgba(255,255,255,0.5); border: 1px solid rgba(45,106,79,0.12); padding: 12px 30px; border-radius: 40px; color: var(--gray); font-weight: 700; font-family: 'Cairo', sans-serif; cursor: pointer; margin: 10px 5px; transition: all 0.3s; }
.btn-restart:hover, .btn-home:hover { transform: translateY(-2px); }
.btn-home:hover { border-color: var(--primary); color: var(--primary); }
.review-area { text-align: right; margin-top: 30px; max-height: 300px; overflow-y: auto; }
.review-area h3 { color: var(--primary); margin-bottom: 15px; }
.review-item { background: rgba(217,119,119,0.04); border-right: 3px solid var(--error); padding: 12px; border-radius: 12px; margin-bottom: 10px; text-align: right; font-size: 0.85rem; }
@media (max-width: 768px) {
    .start-card { padding: 30px 20px; margin: 0 15px; }
    .start-card h1 { font-size: 1.5rem; }
    .question-card { padding: 18px; }
    .results-screen { padding: 25px; margin: 80px 15px 30px; }
    .results-stats { gap: 8px; }
    .result-stat .num { font-size: 1.3rem; }
    .stat-badge { font-size: 0.7rem; padding: 3px 8px; }
    .progress-bar-container { width: 100px; }
}
</style>
</head>
<body>

<div class="hero-bg"></div>
<div class="particles" id="particles"></div>

<nav class="navbar" id="navbar" style="display: none;">
    <div class="nav-container">
        <div class="logo-area">
            <img src="images/logo.png" class="logo-small" onerror="this.src='https://via.placeholder.com/40?text=ADGad'">
            <span class="brand">A.D.Gad</span>
        </div>
        <div class="progress-stats">
            <span class="stat-badge stat-answered" id="statAnswered">0/0</span>
            <span class="stat-badge stat-correct" id="statCorrect">✅ 0</span>
            <span class="stat-badge stat-wrong" id="statWrong">❌ 0</span>
            <span class="stat-badge stat-percent" id="statPercent">📊 0%</span>
            <div class="progress-bar-container"><div class="progress-bar" id="progressFill" style="width: 0%"></div></div>
        </div>
    </div>
</nav>

<div class="start-screen" id="startScreen">
    <div class="start-card">
        <img src="images/logo.png" class="main-logo" onerror="this.src='https://via.placeholder.com/100?text=ADGad'">
        <h1>A.D.Gad | Pathology Exam</h1>
        <p class="sub">📚 Pathology MCQ Bank </p>
        <div class="filter-btns" id="filterBtns">
            <button class="active" data-cat="all">📚 All</button>
            <button data-cat="cellinjury">🦠 Cell Injury</button>
            <button data-cat="necrosis">🧬 Necrosis</button>
            <button data-cat="pigments">🎨 Pigments</button>
            <button data-cat="acute">🔥 Acute Inflammation</button>
            <button data-cat="chronic">🩸 Chronic Inflammation</button>

        </div>
        <div class="q-count">📋 Number of MCQ: <span id="totalQ">0</span></div>
        <button class="btn-start" id="startBtn">▶ Start Quiz</button>
    </div>
</div>

<div class="quiz-wrapper" id="quizWrapper">
    <div id="questionsContainer"></div>
    <div class="submit-area">
        <button class="btn-submit" id="submitBtn" disabled>🎯 Show Results</button>
    </div>
</div>

<div class="results-screen" id="resultsScreen">
    <img src="images/logo.png" class="results-logo" onerror="this.src='https://via.placeholder.com/80?text=ADGad'">
    <h2>🏆 Quiz Completed!</h2>
    <div class="score-circle">
        <svg width="150" height="150" viewBox="0 0 150 150">
            <defs><linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#2d6a4f"/><stop offset="100%" stop-color="#1e7a7a"/></linearGradient></defs>
            <circle class="score-bg" cx="75" cy="75" r="60"/>
            <circle class="score-fill" id="scoreFill" cx="75" cy="75" r="60" stroke-dasharray="377" stroke-dashoffset="377"/>
        </svg>
        <div class="score-text">
            <div class="score-big" id="finalScore">0</div>
            <div style="font-size: 0.7rem;">out of <span id="finalTotal">0</span></div>
        </div>
    </div>
    <div id="resultMessage" class="result-msg"></div>
    <div class="results-stats">
        <div class="result-stat c"><div class="num" id="resultCorrect">0</div><div class="label">✅ Correct</div></div>
        <div class="result-stat w"><div class="num" id="resultWrong">0</div><div class="label">❌ Wrong</div></div>
        <div class="result-stat p"><div class="num" id="resultPercent">0%</div><div class="label">📊 Percentage</div></div>
    </div>
    <button class="btn-restart" onclick="restartQuiz()">🔄 Retake Quiz</button>
    <button class="btn-home" onclick="goHome()">🏠 Home</button>
    <div class="review-area" id="reviewArea"></div>
</div>

<script>
const L = ['A', 'B', 'C', 'D', 'E'];
const CATS = {
    cellinjury: '🦠 Cell Injury & Adaptation',
    necrosis: '🧬 Cell Death & Necrosis',
    pigments: '🎨 Pigments & Calcification',
    acute: '🔥 Acute Inflammation',
    chronic: '🩸 Chronic Inflammation',
    suppuration: '💊 Suppuration & Abscess',
    systemic: '🧪 Systemic Effects'
};

const ALL = [
    // ===== CELL INJURY & ADAPTATION (1-15) =====
    {n:1,cat:'cellinjury',q:"Any deviation from the normal structure/function of any part, organ or system of the body which may be clinical (have symptoms) or subclinical is called:",opts:["Disease","Necrosis","Gangrene","Metaplasia"],c:0,exp:"المرض هو أي انحراف عن البنية أو الوظيفة الطبيعية."},
    {n:2,cat:'cellinjury',q:"Mechanism/s by which the lesions are produced is called:",opts:["Aetiology","Pathogenesis","Pathology","Symptoms"],c:1,exp:"الباثوجينيسيس = آلية تكوّن الآفات."},
    {n:3,cat:'cellinjury',q:"When the injury is severe or persistent, cell death may occur and the type of cell injury is called:",opts:["Reversible","Irreversible","Atrophy","Hyperplasia"],c:1,exp:"الإصابة الشديدة/المستمرة تؤدي إلى إصابة غير قابلة للرجوع."},
    {n:4,cat:'cellinjury',q:"Immunologic agents that cause cell injury such as:",opts:["Hypersensitivity reactions","Thermal trauma","Carbon monoxide poisoning","Deficiency of enzymes"],c:0,exp:"تفاعلات فرط الحساسية من العوامل المناعية."},
    {n:5,cat:'cellinjury',q:"Decrease in the size of a normally formed organ due to decrease in the size of its individual cells is called:",opts:["Atrophy","Agenesis","Hypertrophy","Metaplasia"],c:0,exp:"الضمور = نقص حجم العضو بسبب نقص حجم خلاياه."},
    {n:6,cat:'cellinjury',q:"Extreme failure of development is called:",opts:["Aplasia","Agenesis","Hypertrophy","Metaplasia"],c:1,exp:"Agenesis = فشل تام في التطور."},
    {n:7,cat:'cellinjury',q:"Pressure atrophy is one cause of:",opts:["Physiologic atrophy","Pathologic atrophy","Neuropathic atrophy","Pathologic hypertrophy"],c:1,exp:"ضمور الضغط هو ضمور مرضي."},
    {n:8,cat:'cellinjury',q:"If one of a paired organ is out of function or surgically removed, the other organ undergoes:",opts:["Compensatory hypertrophy","Hyperplasia","Dysplasia","Metaplasia"],c:0,exp:"التضخم التعويضي يحدث في العضو المتبقي."},
    {n:9,cat:'cellinjury',q:"An increase in size of an organ or tissue due to increase in the number of its parenchymal cells is called:",opts:["Disease","Hyperplasia","Hypertrophy","Metaplasia"],c:1,exp:"Hyperplasia = زيادة عدد الخلايا."},
    {n:10,cat:'cellinjury',q:"Prostatic hyperplasia in old age is considered as:",opts:["Pathologic hypertrophy","Pathologic hyperplasia","Compensatory hypertrophy","Physiologic hyperplasia"],c:1,exp:"تضخم البروستاتا في الشيخوخة هو hyperplasia مرضي."},
    {n:11,cat:'cellinjury',q:"Chronic reflux esophagitis and chronic gastritis at the edges of peptic ulcers can result in:",opts:["Aplasia","Atrophy","Hypertrophy","Epithelial metaplasia"],c:3,exp:"الالتهاب المزمن قد يؤدي إلى تحول نسيجي ظهاري (Barrett esophagus)."},
    {n:12,cat:'cellinjury',q:"Transformation of one mature differentiated cell type into another is called:",opts:["Aplasia","Atrophy","Hypertrophy","Metaplasia"],c:3,exp:"Metaplasia = تحول نوع خلية ناضجة إلى نوع آخر."},
    {n:13,cat:'cellinjury',q:"Non-neoplastic microscopic change of cells characterized by pleomorphism usually induced by prolonged cell irritation is called:",opts:["Aplasia","Dysplasia","Hypertrophy","Metaplasia"],c:1,exp:"Dysplasia = تغير خلوي مع pleomorphism."},
    {n:14,cat:'cellinjury',q:"Hypersensitivity reactions and autoimmune diseases are a cause of:",opts:["Cell injury","Atrophy","Hypertrophy","Metaplasia"],c:0,exp:"فرط الحساسية وأمراض المناعة الذاتية تسبب إصابة خلوية."},
    {n:15,cat:'cellinjury',q:"The mechanisms of cell injury include:",opts:["Depletion of ATP","Membrane damage","Accumulation of free radicals","All of them"],c:3,exp:"كل هذه الآليات تسبب إصابة خلوية."},

    // ===== CELL DEATH / NECROSIS (16-33) =====
    {n:16,cat:'necrosis',q:"Accumulation of water within the cytoplasm of the cell is called:",opts:["Hydropic change","Hyaline change","Mucoid change","Fatty change"],c:0,exp:"Hydropic change = تجمع الماء داخل السيتوبلازم."},
    {n:17,cat:'necrosis',q:"Excess mucin seen in catarrhal inflammation of mucous membranes is one type of:",opts:["Hydropic change","Hyaline change","Mucoid change","Fatty change"],c:2,exp:"Mucoid change = زيادة المخاط."},
    {n:18,cat:'necrosis',q:"Cell swelling due to accumulation of fat is called:",opts:["Hydropic change","Hyaline change","Mucoid change","Steatosis"],c:3,exp:"Steatosis = تراكم الدهون داخل الخلايا."},
    {n:19,cat:'necrosis',q:"The types of reversible cell injuries are:",opts:["Hydropic change","Hyaline change","Mucoid change","All of them"],c:3,exp:"كل هذه التغيرات قابلة للرجوع."},
    {n:20,cat:'necrosis',q:"Death of a group of cells or tissues within the living body, followed by their degradation by hydrolytic enzymes is called:",opts:["Necrosis","Apoptosis","Fibrosis","Degeneration"],c:0,exp:"النخر = موت مجموعة خلايا داخل الجسم الحي."},
    {n:21,cat:'necrosis',q:"Nuclear changes due to breakdown of DNA and chromatin include:",opts:["Pyknosis","Karyorrhexis","Karyolysis","All of them"],c:3,exp:"Pyknosis + Karyorrhexis + Karyolysis = تغيرات نووية."},
    {n:22,cat:'necrosis',q:"The most common type of necrosis caused by sudden cessation of blood flow in solid organs is:",opts:["Coagulative","Liquefactive","Caseous","Fat"],c:0,exp:"Coagulative necrosis يحدث في الأعضاء الصلبة عند نقص التروية."},
    {n:23,cat:'necrosis',q:"The type of necrosis in amoebic abscess is:",opts:["Coagulative","Liquefactive","Caseous","Fat"],c:1,exp:"خراج الأميبا يسبب liquefactive necrosis."},
    {n:24,cat:'necrosis',q:"Type of necrosis that occurs in the center of tuberculosis granulomas is:",opts:["Coagulative","Liquefactive","Caseous","Fat"],c:2,exp:"Caseous necrosis مميز للسل."},
    {n:25,cat:'necrosis',q:"The general architecture of tissue and the cellular details in caseous necrosis are:",opts:["Retained","Totally lost","Swollen","More apparent"],c:1,exp:"في caseous necrosis تضيع التفاصيل تماماً."},
    {n:26,cat:'necrosis',q:"A special form of cell death occurring in acute pancreatic necrosis and traumatic necrosis of breasts is:",opts:["Coagulative necrosis","Liquefactive necrosis","Caseous necrosis","Fat necrosis"],c:3,exp:"Fat necrosis يحدث في البنكرياس والثدي."},
    {n:27,cat:'necrosis',q:"A form of cell death described as cell suicide aiming to remove unnecessary or diseased cells without tissue injury is:",opts:["Necrosis","Apoptosis","Fibrosis","Karyorrhexis"],c:1,exp:"Apoptosis = موت مبرمج بدون التهاب."},
    {n:28,cat:'necrosis',q:"Regression of lactating breast after withdrawal of breast-feeding is one type of:",opts:["Necrosis","Apoptosis","Fibrosis","Atrophy"],c:1,exp:"هذا مثال على apoptosis فسيولوجي."},
    {n:29,cat:'necrosis',q:"Type of necrosis associated with marked exudation and deposition of fibrin usually in the wall of blood vessels:",opts:["Fat necrosis","Liquefactive necrosis","Caseous necrosis","Fibrinoid necrosis"],c:3,exp:"Fibrinoid necrosis = ترسب الفيبرين في جدار الأوعية."},
    {n:30,cat:'necrosis',q:"A form of cell death characterized by DNA or protein damage, and not accompanied by inflammation:",opts:["Necrosis","Apoptosis","Fibrosis","Karyorrhexis"],c:1,exp:"Apoptosis لا يصحبه التهاب."},
    {n:31,cat:'necrosis',q:"Regression of lactating breast after withdrawal of breast-feeding is one type of:",opts:["Physiologic apoptosis","Atrophy","Aplasia","Pathologic apoptosis"],c:0,exp:"Apoptosis فسيولوجي."},
    {n:32,cat:'necrosis',q:"The cell membrane may show convolutions or projections in:",opts:["Necrosis","Apoptosis","Atrophy","Aplasia"],c:1,exp:"في apoptosis يتشكل blebs على الغشاء."},
    {n:33,cat:'necrosis',q:"The morphological changes in apoptosis include:",opts:["Cytoplasmic blebs","Cell shrinkage","Chromatin condensation","All of them"],c:3,exp:"كل هذه تغيرات مميزة للـ apoptosis."},

    // ===== PIGMENTS & CALCIFICATION =====
    {n:34,cat:'pigments',q:"Dry gangrene begins in:",opts:["Distal part of limbs","Forearms","Bed sores","Head and neck"],c:0,exp:"الغرغرينا الجافة تبدأ في الأطراف البعيدة."},
    {n:35,cat:'pigments',q:"High sugar content in the necrotic tissue may be a predisposing factor for:",opts:["Wet gangrene","Dry gangrene","Liquefactive necrosis","Atrophy"],c:0,exp:"السكر العالي يهيئ للغرغرينا الرطبة (مثل قدم السكري)."},
    {n:36,cat:'pigments',q:"Bed sores are one type of:",opts:["Liquefactive necrosis","Dry gangrene","Wet gangrene","Mucoid change"],c:0,exp:"قرح الفراش = liquefactive necrosis."},
    {n:37,cat:'pigments',q:"Liver is enlarged, soft, tense glistening capsule, rounded margins, cut surface bulges, pale yellow, greasy to touch. This gross picture is of:",opts:["Hydropic change","Hyaline change","Mucoid change","Fatty change"],c:3,exp:"الوصف الكلاسيكي للكبد الدهني."},
    {n:38,cat:'pigments',q:"Generalized (systemic) haemosiderosis occurs whenever there is:",opts:["Repeated blood transfusion","Inborn error of metabolism","Clostridia infection","Development of moist gangrene"],c:0,exp:"نقل الدم المتكرر سبب رئيسي لـ hemosiderosis."},
    {n:39,cat:'pigments',q:"The type of calcification in breast cancer is:",opts:["Dystrophic calcification","Metastatic calcification","Cartilage calcification","Calcium soaps"],c:0,exp:"سرطان الثدي يسبب dystrophic calcification."},
    {n:40,cat:'pigments',q:"Hemolytic anemia is a predisposing factor of:",opts:["Leukodermia","Primary hemochromatosis","Hypercalcemia","Secondary hemochromatosis"],c:3,exp:"فقر الدم الانحلالي يسبب hemosiderosis ثانوي."},
    {n:41,cat:'pigments',q:"Metastatic calcification is characterized by:",opts:["Occurs in normal tissues","Abnormal calcium metabolism","Hypercalcemia","All of them"],c:3,exp:"Metastatic calcification = أنسجة طبيعية + فرط كالسيوم + خلل استقلاب."},
    {n:42,cat:'pigments',q:"The intracellular accumulation of protein is called:",opts:["Hyaline change","Mucoid degeneration","Steatosis","Hemosiderosis"],c:0,exp:"Hyaline change = تراكم بروتيني داخل الخلايا."},

    // ===== ACUTE INFLAMMATION =====
    {n:43,cat:'acute',q:"The aim of inflammation is to:",opts:["Dilute or neutralize causative agents","Destroy harmful causative agents","Eliminate the necrotic cells","All of them"],c:3,exp:"كل هذه أهداف الالتهاب."},
    {n:44,cat:'acute',q:"The predominant leukocyte during acute inflammation is:",opts:["Neutrophil","Lymphocyte","Macrophage","All of them"],c:0,exp:"العدلات هي الخلية السائدة في الالتهاب الحاد."},
    {n:45,cat:'acute',q:"The cardinal signs of acute inflammation include:",opts:["Redness","Hotness","Pain","All of them"],c:3,exp:"العلامات الكلاسيكية: حرارة، حمرة، تورم، ألم، فقدان وظيفة."},
    {n:46,cat:'acute',q:"The redness and hotness during acute inflammation is due to:",opts:["Thrombosis","Ischemia","Hypoxia","Increase blood flow"],c:3,exp:"فرط التروية يسبب الحمرة والحرارة."},
    {n:47,cat:'acute',q:"The immediate vascular response during acute inflammation is:",opts:["Thrombosis","Ischemia","Vasoconstriction","Vasodilatation"],c:2,exp:"أول استجابة وعائية = vasoconstriction عابر ثم vasodilation."},
    {n:48,cat:'acute',q:"The fluid of little protein that moves from capillaries due to elevated local intravascular hydrostatic pressure is called:",opts:["Exudate","Transudate","Pus","Serum"],c:1,exp:"Transudate = قليل البروتين، فرط الضغط الهيدروستاتيكي."},
    {n:49,cat:'acute',q:"Margination is the process of accumulation along the vascular endothelial surface of:",opts:["Neutrophil","Lymphocyte","Macrophage","All of them"],c:0,exp:"Margination للعدلات في الالتهاب الحاد."},
    {n:50,cat:'acute',q:"Endothelial cell contraction occurs under the effect of:",opts:["Histamine","Bradykinin","Leukotrienes","All of them"],c:3,exp:"كل هذه الوسائط تسبب انقباض البطانة."},
    {n:51,cat:'acute',q:"The firm adhesion of neutrophils to endothelial surfaces is mediated under the effect of:",opts:["Histamine","Bradykinin","Leukotrienes","Integrin"],c:3,exp:"Integrins مسؤولة عن الالتصاق القوي."},
    {n:52,cat:'acute',q:"The movement of leucocytes through the vessel wall is called:",opts:["Diapedesis","Margination","Phagocytosis","None of them"],c:0,exp:"Diapedesis = عبور الكريات البيضاء لجدار الوعاء."},
    {n:53,cat:'acute',q:"The substances that destroy phagocytosed microbes and remove dead tissues are:",opts:["Lysosomal enzymes","Reactive oxygen","Nitrogen species","All of them"],c:3,exp:"كل هذه آليات قتل الميكروبات داخل البلاعم."},
    {n:54,cat:'acute',q:"One of the mediators that amplify the inflammatory reaction is:",opts:["Platelet aggregation factor","Arachidonic acid","Vit K","Factor V"],c:0,exp:"PAF وسيط قوي للالتهاب."},
    {n:55,cat:'acute',q:"The process by which neutrophils and macrophages ingest bacteria and foreign particles is called:",opts:["Diapedesis","Margination","Phagocytosis","None of them"],c:2,exp:"Phagocytosis = البلعمة."},
    {n:56,cat:'acute',q:"A specific surface receptor which recognizes components of micro-organisms and dead cells or host proteins is called:",opts:["Opsonins","Bradykinin","Leukotrienes","Integrin"],c:0,exp:"Opsonins تساعد في التعرف على الأهداف."},
    {n:57,cat:'acute',q:"The Ag binds to which region of antibody to mediate opsonization:",opts:["IgG","FC","Fab","IgM"],c:2,exp:"Fab هو منطقة ارتباط الجسم المضاد بالمولد الضد."},
    {n:58,cat:'acute',q:"The region of antibody that binds FC receptors on the plasma membrane of phagocytes to start phagocytosis:",opts:["IgG","FC","Fab","IgM"],c:1,exp:"FC region تربط مستقبلات FC على البلعميات."},
    {n:59,cat:'acute',q:"The composition of inflammatory exudate includes:",opts:["Fibrinogen","Macrophages","Neutrophils","All of them"],c:3,exp:"Exudate يحتوي كل هذه المكونات."},
    {n:60,cat:'acute',q:"The macrophages that are present in inflammatory exudate are derived from blood:",opts:["Fibroblast","Eosinophils","Neutrophils","Monocyte"],c:3,exp:"البالعات الكبيرة تنشأ من monocytes."},
    {n:61,cat:'acute',q:"The antibodies present in inflammatory exudate at area of inflammation are:",opts:["Bacteriolysins","Agglutinins","Opsonins","All of them"],c:3,exp:"كل هذه أنواع من الأجسام المضادة."},
    {n:62,cat:'acute',q:"Neutrophils present in inflammatory exudate, when they die, they are changed into:",opts:["Pus","Eosinophils","Neutrophils","Monocytes"],c:0,exp:"العدلات الميتة تتحول إلى pus cells."},
    {n:63,cat:'acute',q:"The arachidonic acid metabolites include:",opts:["Bacteriolysins","Agglutinins","Prostaglandins","All of them"],c:2,exp:"البروستاجلاندينات من مستقلبات حمض الأراكيدونيك."},
    {n:64,cat:'acute',q:"The plasma-protein-derived mediators include:",opts:["Bacteriolysins","Agglutinins","Prostaglandins","Bradykinin"],c:3,exp:"Bradykinin من وسائط البلازما (نظام الكينين)."},
    {n:65,cat:'acute',q:"Histamine acts as what during the inflammatory process:",opts:["Vasodilator","Vasoconstrictor","Pain killer","Chemotactic"],c:0,exp:"الهيستامين موسع للأوعية."},
    {n:66,cat:'acute',q:"The vascular permeability during inflammation is increased under the effect of:",opts:["Histamine","Serotonin","Bradykinin","All of them"],c:3,exp:"كل هذه الوسائط تزيد النفاذية الوعائية."},
    {n:67,cat:'acute',q:"Leucocyte recruitment and activation during inflammation occur under the effect of:",opts:["Histamine","Serotonin","Leukotriene","Platelet activating factor"],c:2,exp:"الليوكوترينات تجذب وتنشط الكريات البيضاء."},
    {n:68,cat:'acute',q:"Responsible for fever production during inflammation:",opts:["IL-1","TNF","Prostaglandins","All of them"],c:3,exp:"كل هذه تسبب الحمى (PGs تعيد ضبط مركز الحرارة)."},
    {n:69,cat:'acute',q:"The morphology of acute inflammation depends upon:",opts:["Its specific cause","Tissue involved","Severity of the inflammatory response","All of them"],c:3,exp:"كل هذه عوامل تحدد الشكل."},
    {n:70,cat:'acute',q:"The herpes simplex virus can cause:",opts:["Serous inflammation","Fibrinous inflammation","Catarrhal inflammation","None of them"],c:0,exp:"فيروس الهربس يسبب التهاباً مصلياً (بثور)."},
    {n:71,cat:'acute',q:"In fibrinous inflammation, the serous membranes appear opaque and rough due to fibrin precipitation giving what appearance:",opts:["Dark black","Yellowish-white","Bread and butter","Cheesy"],c:2,exp:"مظهر \"الخبز والزبدة\" مميز للـ fibrinous inflammation."},
    {n:72,cat:'acute',q:"In late fibrinous inflammation, the restoration phase occurs by the action of:",opts:["Macrophages","Eosinophils","Neutrophils","Monocytes"],c:0,exp:"البالعات الكبيرة تزيل الفيبرين."},
    {n:73,cat:'acute',q:"In fibrinous inflammation, failure to completely remove fibrin in restoration phase results in:",opts:["Ulcer","Organization and scarring","Wet gangrene","Calcification"],c:1,exp:"بقاء الفيبرين يؤدي إلى تنظيم وتليف."},
    {n:74,cat:'acute',q:"The catarrhal inflammation is characterized by excessive secretion of:",opts:["Fibrin","Mucus","Pus","Fat globule"],c:1,exp:"Catarrhal = إفراز مخاطي مفرط."},
    {n:75,cat:'acute',q:"In pseudomembranous fibrinous inflammation, the pseudomembrane consists of:",opts:["Causative organism","Necrotic mucosa","Fibrin threads","All of them"],c:3,exp:"الغشاء الكاذب يحتوي كل هذه المكونات."},
    {n:76,cat:'acute',q:"Bronchial asthma is one form of:",opts:["Serous inflammation","Fibrinous inflammation","Catarrhal inflammation","Allergic inflammation"],c:3,exp:"الربو = التهاب تحسسي."},
    {n:77,cat:'acute',q:"The type of inflammation in Vincent's angina is:",opts:["Necrotizing inflammation","Fibrinous inflammation","Catarrhal inflammation","Allergic inflammation"],c:0,exp:"Vincent's angina = التهاب ناخر."},
    {n:78,cat:'acute',q:"An acute inflammation characterized by pus formation is called:",opts:["Necrotizing inflammation","Fibrinous inflammation","Catarrhal inflammation","Suppurative inflammation"],c:3,exp:"Suppurative = قيحي."},
    {n:79,cat:'acute',q:"The causative microorganism of suppurative inflammation is:",opts:["Clostridium","Staphylococcus aureus","E. coli","Streptococci"],c:1,exp:"المكورات العنقودية الذهبية سبب رئيسي للقيح."},
    {n:80,cat:'acute',q:"The vascular phenomena result in forming a pyogenic membrane which is composed of:",opts:["Dilated congested capillaries","Neutrophils","Organisms","All of them"],c:3,exp:"كل هذه مكونات الغشاء القيحي."},

    // ===== SUPPURATION =====
    {n:81,cat:'suppuration',q:"Staph produces which enzyme that helps localize suppuration by transforming fibrinogen into fibrin:",opts:["Lysosomal enzymes","Coagulase","Protease","Catalase"],c:1,exp:"Coagulase يحول الفيبرينوجين إلى فيبرين فيحاصر الالتهاب."},
    {n:82,cat:'suppuration',q:"The mid zone of an abscess contains:",opts:["Causative organism","Pus","Fibrin thread","Pyogenic membrane"],c:1,exp:"المنطقة الوسطى = pus."},
    {n:83,cat:'suppuration',q:"The peripheral zone of an abscess contains:",opts:["Causative organism","Pus","Fibrin thread","Pyogenic membrane"],c:3,exp:"المحيط = pyogenic membrane."},
    {n:84,cat:'suppuration',q:"A small abscess related to a hair follicle or sebaceous gland is called:",opts:["Furuncle","Carbuncle","Ulcer","Phlegmon"],c:0,exp:"Furuncle = دمل صغير حول بصيلة شعر."},
    {n:85,cat:'suppuration',q:"Carbuncle is a localized suppurative inflammation in the subcutaneous tissue open on the surface by:",opts:["One orifice","Multiple openings","Forming ulcer","Lysosomal enzymes"],c:1,exp:"Carbuncle = فتحات متعددة (multilocular)."},
    {n:86,cat:'suppuration',q:"A local defect of skin or mucosal surface leading to sloughing or shedding of inflammatory necrotic tissue is called:",opts:["Furuncle","Carbuncle","Ulcer","Cellulitis"],c:2,exp:"Ulcer = قرحة."},
    {n:87,cat:'suppuration',q:"An abnormal tract connecting two cavities or between a hollow viscera and the surface is called:",opts:["Furuncle","Carbuncle","Sinus","Fistula"],c:3,exp:"Fistula = ناسور مفتوح من الطرفين."},
    {n:88,cat:'suppuration',q:"Types of fistula are:",opts:["Inflammatory","Congenital","Fibrinoid","A & B"],c:3,exp:"Fistula إما التهابي أو خلقي."},
    {n:89,cat:'suppuration',q:"A diffuse suppurative inflammation of subcutaneous tissue is called:",opts:["Phlegmon","Phlebitis","Enteritis","Cellulitis"],c:3,exp:"Cellulitis = التهاب قيحي منتشر."},
    {n:90,cat:'suppuration',q:"The causative organism of diffuse suppurative inflammation is:",opts:["Clostridium","Staphylococcus aureus","E. coli","Streptococci"],c:3,exp:"Streptococci تسبب cellulitis المنتشر."},
    {n:91,cat:'suppuration',q:"In diffuse suppurative inflammation, spread of infection occurs by dissolving the mucopolysaccharide matrix under the effect of:",opts:["Lysosomal enzymes","Coagulase","Protease","None of them"],c:0,exp:"الإنزيمات الليزوزومية تحلل المصفوفة."},
    {n:92,cat:'suppuration',q:"During abscess formation, when pus is mixed with blood it becomes:",opts:["Thrombosed","Ischemic","Hemorrhagic","Sanguineous"],c:3,exp:"Pus + blood = sanguineous (دموي)."},

    // ===== SYSTEMIC EFFECTS =====
    {n:93,cat:'systemic',q:"Bacterial products called exogenous pyrogens stimulate leucocytes to release endogenous pyrogens such as:",opts:["TNF-α","Coagulase","Protease","None of them"],c:0,exp:"TNF-α من البيروجينات الداخلية."},
    {n:94,cat:'systemic',q:"During bacterial infections, the induced leucocytosis is mainly due to:",opts:["Eosinophilia","Neutrophilia","Lymphocytosis","Basophilia"],c:1,exp:"العدلات هي السائدة في العدوى البكتيرية."},
    {n:95,cat:'systemic',q:"Accelerate the release of cells from the bone marrow reserve pool:",opts:["TNF-α","IL-1","PG","A & B"],c:3,exp:"TNF-α و IL-1 يحفزان إطلاق الخلايا من النخاع."},
    {n:96,cat:'systemic',q:"Allergic reactions and parasitic infestations are associated with:",opts:["Eosinophilia","Neutrophilia","Lymphocytosis","Basophilia"],c:0,exp:"الحساسية والطفيليات ترفع الحمضات."},
    {n:97,cat:'systemic',q:"Typhoid fever and rickettsiae are associated with:",opts:["Basophilia","Neutrophilia","Lymphocytosis","Leucopenia"],c:3,exp:"التيفويد والريكتسيا تسبب leucopenia."},
    {n:98,cat:'systemic',q:"Decreased number of circulating white cells associated with typhoid fever infection is likely due to:",opts:["Sequestration of lymphocytes in lymph nodes","Bone marrow depression","Vasoconstriction","Ischemia"],c:1,exp:"تثبيط النخاع العظمي."},
    {n:99,cat:'systemic',q:"Acute-phase proteins synthesized in the liver whose concentrations increase in response to inflammatory stimuli include:",opts:["Serum amyloid A","CRP","Leukotriene","A & B"],c:3,exp:"SAA و CRP من بروتينات الطور الحاد."},
    {n:100,cat:'systemic',q:"Binds to erythrocytes and causes them to form stacks (rouleaux) that sediment more rapidly:",opts:["TNF-α","Fibrinogen","Leukotriene","A & B"],c:1,exp:"الفيبرينوجين يسبب rouleaux ويرفع ESR."},
    {n:101,cat:'systemic',q:"Shock is one form of acute phase reaction due to production of numerous quantities of:",opts:["TNF-α","Fibrinogen","Leukotriene","PG"],c:0,exp:"TNF-α الزائد يسبب صدمة."},
    {n:102,cat:'systemic',q:"Shock results from profuse systemic vasodilatation with increased vascular permeability, which leads to:",opts:["Hypertension","Hypotension","Necrosis","None of them"],c:1,exp:"توسع الأوعية المنتشر يسبب انخفاض ضغط الدم."},
    {n:103,cat:'systemic',q:"In acute-phase response of inflammation, the actions of cytokines on brain cells result in:",opts:["Anorexia","Drowsiness","Malaise","All of them"],c:3,exp:"كل هذه أعراض عامة للالتهاب."},
    {n:104,cat:'systemic',q:"Termination of the acute inflammatory response involves:",opts:["Neutralization","Enzymatic degradation","Normalization of vascular permeability","All of them"],c:3,exp:"كل هذه آليات إنهاء الالتهاب الحاد."},
    {n:105,cat:'systemic',q:"Cessation of leucocyte emigration with subsequent death of extravasated neutrophils indicates:",opts:["Hypotension","Vasoconstriction","Termination of the acute inflammatory response","Infarction"],c:2,exp:"هذا من مؤشرات إنهاء الالتهاب الحاد."},

    // ===== CHRONIC INFLAMMATION =====
    {n:106,cat:'chronic',q:"When inflammation occurs in tissues that cannot regenerate and the cause is removed, healing occurs by:",opts:["Furuncle","Carbuncle","Ulcer","Fibrosis"],c:3,exp:"الأنسجة غير القابلة للتجدد تلتئم بالتليف."},
    {n:107,cat:'chronic',q:"Occurs when the acute response cannot be resolved because of persistence of the injurious agent:",opts:["Serous inflammation","Fibrinous inflammation","Catarrhal inflammation","Chronic inflammation"],c:3,exp:"استمرار العامل المسبب = التهاب مزمن."},
    {n:108,cat:'chronic',q:"The type of hypersensitivity in chronic inflammation is:",opts:["Type I hypersensitivity","Type II hypersensitivity","Type III hypersensitivity","Delayed-type hypersensitivity"],c:3,exp:"النوع الرابع (متأخر) هو المسؤول."},
    {n:109,cat:'chronic',q:"Rheumatoid arthritis disease is one type of:",opts:["Autoimmune diseases","Chronic inflammation","Catarrhal inflammation","A & B"],c:3,exp:"الروماتويد = التهاب مزمن + مرض مناعي ذاتي."},
    {n:110,cat:'chronic',q:"In chronic inflammation, the common leukocytic infiltration includes:",opts:["Macrophages","Lymphocytes","Plasma cells","All of them"],c:3,exp:"كل هذه خلايا الالتهاب المزمن."},
    {n:111,cat:'chronic',q:"Angiogenesis is a common proliferative change of:",opts:["Serous inflammation","Acute inflammation","Catarrhal inflammation","Chronic inflammation"],c:3,exp:"تولد الأوعية سمة للالتهاب المزمن."},
    {n:112,cat:'chronic',q:"When stimuli or causative agent is eliminated and the inflammatory reaction subsides, macrophages eventually die or go to:",opts:["Interstitial tissue","Blood","Lymphatics","Chronic inflammation"],c:2,exp:"البالعات الكبيرة تنتقل إلى الأوعية الليمفاوية."},
    {n:113,cat:'chronic',q:"Eosinophils are characteristically found in inflammatory sites around parasitic infections or as part of immune reactions of allergies. Which cell is this?",opts:["Macrophages","Lymphocytes","Neutrophils","Eosinophils"],c:3,exp:"الحمضات (Eosinophils)."},
    {n:114,cat:'chronic',q:"Chronic non-specific inflammation is called:",opts:["Serous inflammation","Acute inflammation","Catarrhal inflammation","Chronic abscess"],c:3,exp:"الخراج المزمن = التهاب مزمن غير نوعي."},
    {n:115,cat:'chronic',q:"The presence of bacterial toxins in the blood is called:",opts:["Inflammation","Toxemia","Bacteremia","Septicemia"],c:1,exp:"Toxemia = سموم بكتيرية في الدم."},
    {n:116,cat:'chronic',q:"Presence of small number of bacteria in the blood which don't multiply significantly is called:",opts:["Inflammation","Toxemia","Bacteremia","Septicemia"],c:2,exp:"Bacteremia = بكتيريا قليلة في الدم."},
    {n:117,cat:'chronic',q:"Presence of rapidly multiplying highly pathogenic bacteria in the blood is called:",opts:["Inflammation","Toxemia","Bacteremia","Septicemia"],c:3,exp:"Septicemia = بكتيريا تتكاثر بسرعة."},
    {n:118,cat:'chronic',q:"Petechial hemorrhages all over the body is a characteristic feature of:",opts:["Inflammation","Toxemia","Bacteremia","Septicemia"],c:3,exp:"نزيف نقطي منتشر = سمة septicemia."},
    {n:119,cat:'chronic',q:"The dissemination of small septic thrombi in the blood, which cause abscess at the sites where they are lodged is called:",opts:["Pyemia","Toxemia","Bacteremia","Septicemia"],c:0,exp:"Pyemia = خراجات متعددة من خثرات قيحية."},
    {n:120,cat:'chronic',q:"The function of fibrin present in exudate is:",opts:["Help localization of infection","Coagulation","Help attraction of leukocytes","Spread of infection"],c:0,exp:"الفيبرين يحاصر الالتهاب."},

    // ===== Extra MCQ =====
    {n:121,cat:'acute',q:"Fall of leukocytes out of the central column and begin to line the endothelium is called:",opts:["Phagocytosis","Margination","Opsonization","Pavementing"],c:3,exp:"Pavementing = اصطفاف الكريات على البطانة."},
    {n:122,cat:'acute',q:"Microphages are derived mainly from:",opts:["Neutrophils","Basophils","B Lymphocytes","T Lymphocytes"],c:0,exp:"Microphages = العدلات."},
    {n:123,cat:'acute',q:"Microphages are mainly attracted to and engulf:",opts:["Bacilli","Cocci","Fungi","Virus"],c:1,exp:"العدلات تشمل cocci عادة."},
    {n:124,cat:'acute',q:"Pus cells are derived from dead:",opts:["Neutrophils","Monocytes","Basophils","Lymphocytes"],c:0,exp:"Pus cells = عدلات ميتة."},
    {n:125,cat:'chronic',q:"Macrophages are derived mainly from:",opts:["Neutrophils","Monocytes","Basophils","Lymphocytes"],c:1,exp:"البالعات الكبيرة تنشأ من monocytes."},
    {n:126,cat:'systemic',q:"Some infections like typhoid may cause instead of leukocytosis:",opts:["Neutrophilia","Leucopenia","Inflammatory edema","Erythrobiosis"],c:1,exp:"التيفويد يسبب نقص الكريات."},

let currentCategory = 'all';
let currentQuestions = [];
let answeredCount = 0;
let correctCount = 0;
let wrongCount = 0;
let quizActive = false;

for(let i = 0; i < 40; i++) {
    let p = document.createElement('div');
    p.className = 'particle';
    p.style.width = Math.random() * 5 + 2 + 'px';
    p.style.height = p.style.width;
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = Math.random() * 20 + 15 + 's';
    p.style.animationDelay = Math.random() * 15 + 's';
    document.getElementById('particles').appendChild(p);
}

document.querySelectorAll('.filter-btns button').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btns button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.cat;
        const filtered = currentCategory === 'all' ? ALL : ALL.filter(q => q.cat === currentCategory);
        document.getElementById('totalQ').textContent = filtered.length;
    });
});

document.getElementById('totalQ').textContent = ALL.length;

function startQuiz() {
    currentQuestions = currentCategory === 'all' ? [...ALL] : ALL.filter(q => q.cat === currentCategory);
    answeredCount = 0;
    correctCount = 0;
    wrongCount = 0;
    quizActive = true;
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('quizWrapper').style.display = 'block';
    document.getElementById('navbar').style.display = 'block';
    document.getElementById('resultsScreen').style.display = 'none';
    updateStats();
    renderQuestions();
}

function renderQuestions() {
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';
    let lastCat = '';
    currentQuestions.forEach((q, idx) => {
        if (lastCat !== q.cat) {
            const header = document.createElement('div');
            header.className = 'section-header';
            header.innerHTML = `<div class="section-line"></div><div class="section-title">${CATS[q.cat]}</div><div class="section-line right"></div>`;
            container.appendChild(header);
            lastCat = q.cat;
        }
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-${idx}`;
        card.dataset.index = idx;
        const optsHtml = q.opts.map((opt, optIdx) => 
            `<div class="option" data-letter="${L[optIdx]}" data-opt="${optIdx}" onclick="selectAnswer(${idx}, ${optIdx})">${opt}</div>`
        ).join('');
        card.innerHTML = `
            <div class="q-header"><div class="q-num">${q.n}</div><div class="q-cat">${CATS[q.cat]}</div></div>
            <div class="q-text">${q.q}</div>
            <div class="options" id="opts-${idx}">${optsHtml}</div>
            <div class="feedback" id="fb-${idx}"></div>
        `;
        container.appendChild(card);
    });
    document.getElementById('submitBtn').disabled = true;
}

function selectAnswer(qIdx, optIdx) {
    if (!quizActive) return;
    const q = currentQuestions[qIdx];
    const optsDiv = document.getElementById(`opts-${qIdx}`);
    if (optsDiv.querySelector('.correct,.wrong')) return;
    const isCorrect = optIdx === q.c;
    const allOpts = optsDiv.querySelectorAll('.option');
    allOpts.forEach(opt => {
        opt.style.pointerEvents = 'none';
        if (parseInt(opt.dataset.opt) === q.c) opt.classList.add('correct');
        else if (parseInt(opt.dataset.opt) === optIdx && !isCorrect) opt.classList.add('wrong');
    });
    const fb = document.getElementById(`fb-${qIdx}`);
    fb.style.display = 'block';
    fb.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
    fb.innerHTML = isCorrect ? `✅ Correct! ${q.exp}` : `❌ Wrong! The correct answer: ${q.opts[q.c]}<br>📖 ${q.exp}`;
    document.getElementById(`q-${qIdx}`).classList.add(isCorrect ? 'correct' : 'wrong');
    if (isCorrect) correctCount++; else wrongCount++;
    answeredCount++;
    updateStats();
    if (answeredCount === currentQuestions.length) document.getElementById('submitBtn').disabled = false;
}

function updateStats() {
    const total = currentQuestions.length;
    const percent = answeredCount > 0 ? Math.round(correctCount / answeredCount * 100) : 0;
    document.getElementById('statAnswered').textContent = `${answeredCount}/${total}`;
    document.getElementById('statCorrect').textContent = `✅ ${correctCount}`;
    document.getElementById('statWrong').textContent = `❌ ${wrongCount}`;
    document.getElementById('statPercent').textContent = `📊 ${percent}%`;
    const progress = total > 0 ? (answeredCount / total * 100) : 0;
    document.getElementById('progressFill').style.width = `${progress}%`;
}

function showResults() {
    quizActive = false;
    const total = currentQuestions.length;
    const percent = Math.round(correctCount / total * 100);
    document.getElementById('finalScore').textContent = correctCount;
    document.getElementById('finalTotal').textContent = total;
    document.getElementById('resultCorrect').textContent = correctCount;
    document.getElementById('resultWrong').textContent = wrongCount;
    document.getElementById('resultPercent').textContent = `${percent}%`;
    const circumference = 377;
    const offset = circumference - (percent / 100 * circumference);
    document.getElementById('scoreFill').style.strokeDashoffset = offset;
    let msg = '';
    if (percent >= 90) msg = '🌟 Excellent! Outstanding performance in Pathology!';
    else if (percent >= 75) msg = '👏 Very Good! Keep up the great work!';
    else if (percent >= 60) msg = '👍 Good! Review the incorrect answers.';
    else msg = '📚 Needs more revision — You can do better!';
    document.getElementById('resultMessage').innerHTML = msg;
    const reviewDiv = document.getElementById('reviewArea');
    reviewDiv.innerHTML = '<h3>📋 Review Incorrect Answers</h3>';
    let hasWrong = false;
    currentQuestions.forEach((q, idx) => {
        const card = document.getElementById(`q-${idx}`);
        if (card && card.classList.contains('wrong')) {
            hasWrong = true;
            reviewDiv.innerHTML += `
                <div class="review-item">
                    <strong>❌ Question ${q.n}:</strong> ${q.q}<br>
                    <strong>✅ Correct Answer:</strong> ${q.opts[q.c]}<br>
                    <span style="font-size:0.8rem; opacity:0.8;">📖 ${q.exp}</span>
                </div>`;
        }
    });
    if (!hasWrong) reviewDiv.innerHTML = '<div style="text-align:center;color:#2d6a4f;padding:20px;">🎉 All answers correct! Excellent work!</div>';
    document.getElementById('quizWrapper').style.display = 'none';
    document.getElementById('resultsScreen').style.display = 'block';
}

function restartQuiz() { startQuiz(); }

function goHome() {
    quizActive = false;
    document.getElementById('quizWrapper').style.display = 'none';
    document.getElementById('navbar').style.display = 'none';
    document.getElementById('resultsScreen').style.display = 'none';
    document.getElementById('startScreen').style.display = 'flex';
    window.scrollTo(0, 0);
}

document.getElementById('startBtn').addEventListener('click', startQuiz);
document.getElementById('submitBtn').addEventListener('click', showResults);
</script>
</body>
</html>
